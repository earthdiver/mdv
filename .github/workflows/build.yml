name: Build and verify Windows app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./scripts/build.ps1
        shell: pwsh
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: ./scripts/smoke-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: MDV-portable-win-x64
          compression-level: 0
          path: artifacts/MDV-portable-win-x64/MDV.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            artifacts/native-smoke.*
            artifacts/portable-*.json
            artifacts/MDV-portable-win-x64.sha256
            artifacts/preview-qiita.png
            test-results/
